import com.wargamesdevelopment.distanthorizons.gradle.FoundationSupport

/*
 * DistantHorizons-WDG dependency contract
 *
 * Required runtime/implementation mods:
 *  - lwjgl3ify: LWJGL 3 and Java 8 parent -> Java 21 child bootstrap environment
 *  - GTNHLib: directly used implementation APIs
 *  - UniMixins/GTNHMixins: supplied by the GTNHGradle Mixin convention when usesMixins=true
 *
 * Optional integrations are compileOnly and are never published as mandatory dependencies.
 * Private Java libraries use shadowImplementation and are included in the production DH JAR.
 */
minecraft {
    mainLwjglVersion = 3
    lwjgl3Version = "3.4.0"
}

def defaultLwjgl3ify = "com.github.GTNewHorizons:lwjgl3ify:3.0.28:dev"
def gtnhLib = "com.github.GTNewHorizons:GTNHLib:0.11.31:dev"
def hodgepodge = "com.github.GTNewHorizons:Hodgepodge:2.7.13:dev"
def angelica = "com.github.GTNewHorizons:Angelica:2.1.54:dev"
def nei = "com.github.GTNewHorizons:NotEnoughItems:2.7.4-GTNH:dev"

def localLwjgl3ifyDevPath = providers.gradleProperty("wdgLwjgl3ifyDevJar")
    .orElse(providers.environmentVariable("WDG_LWJGL3IFY_DEV_JAR"))
def localAngelicaPath = providers.gradleProperty("wdgAngelicaJar")
    .orElse(providers.environmentVariable("WDG_ANGELICA_JAR"))

def enableHodgepodgeRuntime = providers.gradleProperty("wdgEnableHodgepodgeRuntime")
    .map { it.toBoolean() }
    .orElse(false)
def enableNeiRuntime = providers.gradleProperty("wdgEnableNeiRuntime")
    .map { it.toBoolean() }
    .orElse(false)

dependencies {
    testImplementation("junit:junit:4.13.2")

    // Keep a reproducible external coordinate in published metadata.
    implementation(defaultLwjgl3ify)
    implementation(gtnhLib)

    // Optional integrations: compile against their guarded adapters, do not publish as required.
    compileOnly(hodgepodge) {
        transitive = false
    }
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.469:dev") {
        transitive = false
    }
    if (localAngelicaPath.isPresent()) {
        def localAngelicaJar = file(localAngelicaPath.get()).absoluteFile
        if (!localAngelicaJar.isFile() || !localAngelicaJar.canRead()) {
            throw new GradleException("wdgAngelicaJar is not a readable file: ${localAngelicaJar}")
        }
        if (!localAngelicaJar.name.equalsIgnoreCase("angelica-2.1.54.jar")) {
            throw new GradleException(
                "wdgAngelicaJar must be the exact Angelica 2.1.54 production JAR: ${localAngelicaJar.name}"
            )
        }
        compileOnly(rfg.deobf(files(localAngelicaJar)))
        logger.lifecycle("Using exact local Angelica 2.1.54 artifact: ${localAngelicaJar}")
    } else {
        compileOnly(angelica) {
            transitive = false
        }
    }
    compileOnly("com.falsepattern:rple-mc1.7.10:2.1.0:api") {
        transitive = false
    }

    // Opt-in development runtime conveniences only.
    if (enableHodgepodgeRuntime.get()) {
        runtimeOnlyNonPublishable(hodgepodge)
    }
    if (enableNeiRuntime.get()) {
        runtimeOnlyNonPublishable(nei)
    }

    // Internal Java libraries packaged by shadowJar and then reobfuscated for production.
    shadowImplementation("com.electronwill.night-config:toml:3.6.6")
    shadowImplementation("com.electronwill.night-config:json:3.6.6")
    shadowImplementation("org.lz4:lz4-java:1.8.0")
    shadowImplementation("org.tukaani:xz:1.9")
    shadowImplementation("org.xerial:sqlite-jdbc:3.47.2.0")
    shadowImplementation("com.github.luben:zstd-jni:1.5.7-4")
    compileOnly("org.jetbrains:annotations:26.0.2")

    // Exact local development override. Paths containing spaces are supported. The published
    // non-resolvable variants retain defaultLwjgl3ify, while resolvable classpaths exclude it.
    if (localLwjgl3ifyDevPath.isPresent()) {
        def localJar = file(localLwjgl3ifyDevPath.get()).absoluteFile
        if (!localJar.isFile() || !localJar.canRead()) {
            throw new GradleException("wdgLwjgl3ifyDevJar is not a readable file: ${localJar}")
        }
        FoundationSupport.validateLwjglDevelopmentCandidateName(localJar.name)
        devOnlyNonPublishable(rfg.deobf(files(localJar)))
        configurations.configureEach {
            if (canBeResolved) {
                exclude group: "com.github.GTNewHorizons", module: "lwjgl3ify"
            }
        }
        logger.lifecycle("Using explicit local lwjgl3ify development artifact: ${localJar}")
    }
}
