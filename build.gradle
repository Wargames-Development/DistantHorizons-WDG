plugins {
    id 'idea'
    id 'com.gtnewhorizons.gtnhgradle' version '2.0.31'
}

idea {
    project {
        outputFile = file('DistantHorizons-WDG.ipr')
        jdkName = '1.8'
        languageLevel = '1.8'
        vcs = 'Git'
        ipr.withXml {
            def projectXml = asNode()
            def settings = projectXml.component.find { it.@name == 'GradleSettings' } ?:
                    projectXml.appendNode('component', [name: 'GradleSettings'])
            def linked = settings.option.find { it.@name == 'linkedExternalProjectsSettings' } ?:
                    settings.appendNode('option', [name: 'linkedExternalProjectsSettings'])
            def rootBuild = linked.GradleProjectSettings.find { build ->
                build.option.any { it.@name == 'externalProjectPath' && it.@value == '$PROJECT_DIR$' }
            }
            if (rootBuild == null) {
                rootBuild = linked.appendNode('GradleProjectSettings')
                rootBuild.appendNode('option', [name: 'externalProjectPath', value: '$PROJECT_DIR$'])
            }
            def gradleJvm = rootBuild.option.find { it.@name == 'gradleJvm' } ?:
                    rootBuild.appendNode('option', [name: 'gradleJvm'])
            gradleJvm.@value = '#GRADLE_LOCAL_JAVA_HOME'
        }
    }
    workspace {
        iws.withXml {
            def workspaceXml = asNode()
            def runManager = workspaceXml.component.find { it.@name == 'RunManager' } ?:
                    workspaceXml.appendNode('component', [name: 'RunManager'])
            if (!runManager.@selected || runManager.@selected == 'Gradle.distant-horizons [build]') {
                runManager.@selected = 'Shell Script.Build Distant Horizons'
            }
        }
    }
}

tasks.named('ideaWorkspace') {
    outputFile = file('DistantHorizons-WDG.iws')
}

tasks.named('ideaProject') {
    doLast {
        // IDEA reads this machine-local JDK path separately from the Java 8 project SDK.
        def localConfig = file('.gradle/config.properties')
        def properties = new Properties()
        if (localConfig.isFile()) {
            localConfig.withInputStream { properties.load(it) }
        }
        def javaHome = System.getProperty('java.home')
        if (properties.getProperty('java.home') != javaHome) {
            properties.setProperty('java.home', javaHome)
            localConfig.withOutputStream { properties.store(it, null) }
        }
    }
}

def dhBuild = gradle.includedBuild('dh')
group = modGroup
version = gradle.ext.wgVersion
ext.modVersion = version.toString()

def sourceName = "${modName}-${dhLoader}-${version}-${minecraftVersion}"

// The publishers want TaskProvider<Jar>, but the jars are DH's -- clear Jar's own
// packaging action and copy them byte-for-byte instead.
def registerJarCopy = { String taskName, FileCollection source, String classifier ->
    tasks.register(taskName, Jar) {
        archiveFileName.set("${modName}-${version}${classifier}.jar")
        inputs.files(source)

        actions.clear()
        doLast {
            copy {
                from source.singleFile
                into destinationDirectory
                rename { archiveFileName.get() }
            }
        }
    }
}

def dhReleaseJar = files("dh/${dhLoader}/build/libs/${sourceName}.jar")
        .builtBy(dhBuild.task(":${dhLoader}:assemble"))
def collectJars = registerJarCopy('collectJars', dhReleaseJar, '')
def releaseJar = collectJars.flatMap { it.archiveFile }

// Deobfuscate DH's release jar for use as the published compile-time dev jar.
def deobfJar = configurations.detachedConfiguration(dependencies.create(modUtils.deobfuscate(files(releaseJar))))
configurations.runtimeClasspath.attributes.keySet().each { attribute ->
    deobfJar.attributes.attribute(attribute, configurations.runtimeClasspath.attributes.getAttribute(attribute))
}

def collectDevJars = registerJarCopy('collectDevJars', deobfJar, '-dev')
def devJar = collectDevJars.flatMap { it.archiveFile }

// Direct jar invocations must package DH too, consuming one real build number.
tasks.named('jar') {
    enabled = false
    dependsOn collectJars
}
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.artifacts.clear()
        outgoing.artifact(releaseJar) { builtBy collectJars }
    }
}

gtnhGradle.applyModuleByName(project, 'PublishingModule')

publishing.publications.named('maven') {
    artifactId = System.getenv('ARTIFACT_ID') ?: modName
    artifact(devJar) {
        classifier = 'dev'
        builtBy collectDevJars
    }
}

afterEvaluate {
    publishing.publications.named('maven') { version = project.version }
}

tasks.named('assemble') {
    setDependsOn([])
    dependsOn collectJars, collectDevJars
}
tasks.named('check') { dependsOn dhBuild.task(":${dhLoader}:check") }
tasks.named('clean') { dependsOn dhBuild.task(':clean') }

// Keep RFG from preparing Minecraft for this source-less wrapper project.
['compileClasspath', 'testCompileClasspath', 'runtimeClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) { setExtendsFrom([]) }
}
tasks.named('setupCIWorkspace') { setDependsOn([]) }
